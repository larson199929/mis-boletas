<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Boletas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boletas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a receipt roll; summary strip, then month groups of receipt rows; a bottom sheet for scan/detail. */
:root{
  --paper:#F4F5F2; --slip:#FFFFFF; --ink:#1B1F24; --muted:#6B7078; --line:#DFE1DC;
  --stamp:#B4235A; --stamp-soft:#F6E3EA; --ok:#2E7D4F; --scrim:rgba(20,22,26,.45);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121417; --slip:#1B1E22; --ink:#ECEDEA; --muted:#9A9FA6; --line:#2C3036;
  --stamp:#F0679A; --stamp-soft:#3A1E29; --ok:#6BC48E; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121417; --slip:#1B1E22; --ink:#ECEDEA; --muted:#9A9FA6; --line:#2C3036;
  --stamp:#F0679A; --stamp-soft:#3A1E29; --ok:#6BC48E; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:800 34px/1 var(--display);letter-spacing:-.02em;margin:0}
h1 span{color:var(--stamp)}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.menu{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--slip);display:grid;place-items:center;color:var(--ink);flex:none}
.menu:focus-visible{outline:2px solid var(--stamp)}
.opt{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;background:var(--slip);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.opt b{font-weight:600}
.opt span{font-size:13px;color:var(--muted)}
.opt:focus-visible{outline:2px solid var(--stamp)}
.banner{background:var(--stamp-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.banner button{all:unset;cursor:pointer;font-weight:600;color:var(--stamp);white-space:nowrap}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.summary div{background:var(--slip);padding:14px 16px}
.lbl{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font:600 24px/1.1 var(--mono);white-space:nowrap;margin-top:8px;font-variant-numeric:tabular-nums}
.search{width:100%;font:inherit;color:var(--ink);background:var(--slip);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.search:focus,input:focus,textarea:focus,select:focus{outline:2px solid var(--stamp);outline-offset:1px}
.month{display:flex;flex-direction:column;gap:8px}
.month-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.month-h h2{font:600 18px/1 var(--display);margin:0}
.month-h span{font:500 14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--slip);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row:focus-visible{outline:2px solid var(--stamp)}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font:600 13px var(--mono);color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.row .t{min-width:0}
.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font:600 15px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.row .c{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--stamp);margin-top:4px}
.empty{background:var(--slip);border:1px dashed var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.empty h2{font:600 20px/1.2 var(--display);margin:0;text-wrap:balance}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.btn{appearance:none;border:0;font:600 16px var(--body);border-radius:99px;padding:15px 22px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn-main{background:var(--stamp);color:#fff;box-shadow:0 8px 24px -8px var(--stamp)}
.btn-ghost{background:var(--slip);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--stamp);border:1px solid var(--stamp)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.5}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h3{font:700 22px/1 var(--display);margin:0}
.x{all:unset;cursor:pointer;font:600 14px var(--body);color:var(--muted);padding:6px}
.receipt{background:var(--slip);padding:18px 16px 22px;position:relative;font-family:var(--mono);font-size:13px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;
  border-radius:4px 4px 0 0}
.receipt .kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.receipt .kv span:first-child{color:var(--muted)}
.receipt .kv span:last-child{text-align:right;word-break:break-all}
.receipt .tot{display:flex;justify-content:space-between;font-size:18px;font-weight:600;padding-top:10px}
.qrok{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.qrno{font:500 12px var(--mono);color:var(--muted)}
.photo{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
label.f input,label.f textarea{font:400 16px var(--body);color:var(--ink);background:var(--slip);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
label.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font:500 14px var(--body);padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--slip)}
.chip[aria-pressed="true"]{background:var(--stamp-soft);border-color:var(--stamp);color:var(--stamp)}
.chip:focus-visible{outline:2px solid var(--stamp)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.note{font-size:13px;color:var(--muted)}
.cam{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;left:50%;top:44%;width:min(72vw,320px);aspect-ratio:1;max-width:100%;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.9)}
.cam .frame.hit{border-color:#6BC48E}
.cam .hint{position:absolute;left:0;right:0;top:calc(44% + min(36vw,160px) + 18px);text-align:center;color:#fff;font-weight:600;padding:0 24px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.cam .bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cam .bar .btn{flex:1;max-width:220px}
.cam .bar .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.cam .top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));}
.cam .top button{all:unset;cursor:pointer;color:#fff;font-weight:600;padding:8px 12px;background:rgba(0,0,0,.35);border-radius:99px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-weight:600;z-index:40;font-size:14px}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mis <span>Boletas</span></h1>
      <div class="sub">Lo que compraste, ítem por ítem.</div>
    </div>
    <button class="menu" id="menuBtn" type="button" aria-label="Respaldo y opciones">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <div class="banner" id="installTip" hidden>
    <div>Para tenerla como app: toca <b>Compartir</b> en Safari y luego <b>Agregar a pantalla de inicio</b>.</div>
    <button type="button" id="tipClose">Ok</button>
  </div>
  <div class="banner" id="backupTip" hidden>
    <div id="backupTipText">Haz un respaldo de vez en cuando por si cambias de iPhone.</div>
    <button type="button" id="backupNow">Respaldar</button>
  </div>

  <section class="summary" aria-label="Resumen del mes">
    <div><div class="lbl" id="sumLbl">Este mes</div><div class="big" id="sumMonth">S/ 0.00</div></div>
    <div><div class="lbl">Boletas guardadas</div><div class="big" id="sumCount">0</div></div>
  </section>

  <input id="q" class="search" type="search" placeholder="Buscar tienda, producto o RUC…" autocomplete="off">

  <div id="list"></div>
</div>

<div class="fab">
  <button class="btn btn-main" id="scanBtn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
    Escanear boleta
  </button>
  <button class="btn btn-ghost" id="manualBtn" type="button" aria-label="Agregar sin foto">＋</button>
</div>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<input id="restoreFile" type="file" accept=".json,application/json" hidden>

<div id="sheetHost"></div>

<script src="zxing-reader.js"></script>
<script src="jsQR.js"></script>
<script>
const $ = s => document.querySelector(s);
const CATS = ["Súper","Farmacia","Comida","Ropa","Casa","Belleza","Transporte","Otros"];
const TIPOS = {"01":"Factura","03":"Boleta","12":"Ticket"};
const soles = n => "S/ " + (Number(n)||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

let items = [];          // metadata rows
let stores = {};         // RUC -> store name
let filter = "";

/* ---------- Storage: cloud (db) when signed in, this phone otherwise ---------- */
const Local = {
  name:"local", dbp:null,
  open(){ return this.dbp ||= new Promise((res,rej)=>{ const r=indexedDB.open("mis-boletas",1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore("items"); r.result.createObjectStore("photos"); r.result.createObjectStore("meta"); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async tx(store,mode,fn){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction(store,mode); const out=fn(t.objectStore(store)); t.oncomplete=()=>res(out&&out.result); t.onerror=()=>rej(t.error); }); },
  async init(onChange){ this.onChange=onChange; await this.reload(); },
  async reload(){
    const d=await this.open();
    const all=await new Promise((res,rej)=>{const r=d.transaction("items").objectStore("items").getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});
    const st=await new Promise(res=>{const r=d.transaction("meta").objectStore("meta").get("stores"); r.onsuccess=()=>res(r.result||{}); r.onerror=()=>res({});});
    this.onChange(all, st);
  },
  async save(it, photo){ await this.tx("items","readwrite",s=>s.put(it,it.id)); if(photo) await this.tx("photos","readwrite",s=>s.put(photo,it.id)); await this.reload(); },
  async photo(id){ const d=await this.open(); return new Promise(res=>{const r=d.transaction("photos").objectStore("photos").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null);}); },
  async remove(id){ await this.tx("items","readwrite",s=>s.delete(id)); await this.tx("photos","readwrite",s=>s.delete(id)); await this.reload(); },
  async saveStores(st){ await this.tx("meta","readwrite",s=>s.put(st,"stores")); }
};

const Store = Local;
const onData = (rows, st) => { items = rows.slice().sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||"") || b.id.localeCompare(a.id)); stores = st||{}; render(); updateTips(); };

/* ---------- Backup ---------- */
const META = { get(k){ try{ return localStorage.getItem("mb_"+k); }catch{ return null; } }, set(k,v){ try{ localStorage.setItem("mb_"+k,v); }catch{} } };
const isStandalone = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;

function updateTips(){
  $("#installTip").hidden = isStandalone() || META.get("tipClosed")==="1";
  const last = Number(META.get("lastBackup")||0);
  const since = items.filter(i => (i.creado ? Date.parse(i.creado) : 0) > last).length;
  const days = last ? (Date.now()-last)/864e5 : Infinity;
  const show = items.length >= 5 && since >= 5 && days > 25;
  $("#backupTip").hidden = !show;
  if(show) $("#backupTipText").textContent = last
    ? `Tienes ${since} compras nuevas desde tu último respaldo. Guarda una copia por si cambias de iPhone.`
    : `Ya tienes ${items.length} compras. Guarda una copia por si cambias de iPhone.`;
}

async function makeBackup(){
  const full = [];
  for(const it of items){ full.push({ ...it, photo: it.hasPhoto ? await Store.photo(it.id) : null }); }
  const data = JSON.stringify({ app:"mis-boletas", version:1, exportado:new Date().toISOString(), tiendas:stores, compras:full });
  const name = `boletas-respaldo-${todayISO()}.json`;
  const file = new File([data], name, { type:"application/json" });
  try{
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"Respaldo de Mis Boletas" });
      META.set("lastBackup", Date.now()); updateTips(); toast("Respaldo listo"); return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  META.set("lastBackup", Date.now()); updateTips(); toast("Respaldo descargado");
}

async function restoreBackup(file){
  try{
    const j = JSON.parse(await file.text());
    if(j.app!=="mis-boletas" || !Array.isArray(j.compras)) throw new Error("formato");
    let n=0;
    for(const c of j.compras){ if(!c || !c.id) continue; const { photo, ...it } = c; await Local.tx("items","readwrite",s=>s.put(it,it.id)); if(photo) await Local.tx("photos","readwrite",s=>s.put(photo,it.id)); n++; }
    await Local.saveStores({ ...(j.tiendas||{}), ...stores });
    await Local.reload(); closeSheet(); toast(`${n} compras recuperadas`);
  }catch(e){ toast("Ese archivo no es un respaldo de Mis Boletas."); }
}

function menuSheet(){
  const last = Number(META.get("lastBackup")||0);
  openSheet(`
    <div class="sheet-h"><h3>Respaldo</h3><button class="x" data-close type="button">Cerrar</button></div>
    <div class="note">Tus boletas se guardan solo en este iPhone. ${last ? "Último respaldo: " + new Date(last).toLocaleDateString("es-PE",{day:"numeric",month:"long"}) + "." : "Todavía no has hecho un respaldo."}</div>
    <button class="opt" id="mExport" type="button"><b>Guardar respaldo</b><span>Crea un archivo con todas tus compras y fotos. Guárdalo en Archivos, iCloud Drive o envíatelo.</span></button>
    <button class="opt" id="mImport" type="button"><b>Recuperar desde un respaldo</b><span>Elige el archivo .json. Se suma a lo que ya tienes, no borra nada.</span></button>
  `);
  $("#mExport").onclick = async ()=>{ $("#mExport").querySelector("b").textContent="Preparando…"; await makeBackup(); menuSheet(); };
  $("#mImport").onclick = ()=> $("#restoreFile").click();
}

async function boot(){
  render();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch{}
  try{ await Local.init(onData); }
  catch(e){ toast("Este navegador no permite guardar. Ábrela en Safari."); }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* ---------- QR ---------- */
function parseSunat(text){
  const p = text.split("|").map(s=>s.trim());
  if(p.length < 7 || !/^\d{11}$/.test(p[0])) return null;
  let f = p[6];
  const m = f.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})$/); if(m) f = `${m[3]}-${m[2]}-${m[1]}`;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f)) f = todayISO();
  return { ruc:p[0], tipo:p[1], serie:p[2], numero:p[3], igv:parseFloat(p[4])||0, total:parseFloat(p[5])||0, fecha:f };
}
try{
  window.ZXingWASM && ZXingWASM.prepareZXingModule({
    overrides:{ locateFile:(p,prefix)=> p.endsWith(".wasm") ? new URL("zxing_reader.wasm", location.href).href : prefix+p },
    fireImmediately:true
  });
}catch(e){}
function imageDataAt(img, max){
  const s = Math.min(1, max/Math.max(img.width,img.height));
  const c = document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  const x = c.getContext("2d",{willReadFrequently:true}); x.drawImage(img,0,0,c.width,c.height);
  return x.getImageData(0,0,c.width,c.height);
}
async function decodeQR(img){
  // Lector principal: tolera sombras, papel curvo y fotos inclinadas.
  if(window.ZXingWASM){
    for(const m of [1200,800,2000]){
      try{
        const r = await ZXingWASM.readBarcodes(imageDataAt(img,m), { formats:["QRCode"], tryHarder:true, tryRotate:true, tryInvert:true, tryDownscale:true, maxNumberOfSymbols:1 });
        const ok = r.find(x=>x.isValid && x.text);
        if(ok) return ok.text;
      }catch(e){ break; }
    }
  }
  // Respaldo
  if(window.jsQR){
    for(const m of [1000,1600,700]){ const d=imageDataAt(img,m); const r=jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"}); if(r && r.data) return r.data; }
  }
  return null;
}
function compress(img, max=1000, q=.6){
  let s = Math.min(1, max/Math.max(img.width,img.height));
  for(let i=0;i<4;i++){
    const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL("image/jpeg",q);
    if(url.length < 190000) return url;
    s*=.75; q=Math.max(.4,q-.08);
  }
  return null;
}
const loadImg = file => new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{res(i);}; i.onerror=rej; i.src=u; });

/* ---------- Render ---------- */
function render(){
  const now = todayISO().slice(0,7);
  const monthTotal = items.filter(i=>(i.fecha||"").startsWith(now)).reduce((a,i)=>a+(Number(i.total)||0),0);
  $("#sumMonth").textContent = soles(monthTotal);
  $("#sumCount").textContent = items.length;
  $("#sumLbl").textContent = new Date().toLocaleDateString("es-PE",{month:"long"}).replace(/^./,c=>c.toUpperCase());

  const q = filter.toLowerCase();
  const shown = q ? items.filter(i=>[i.tienda,i.detalle,i.ruc,i.categoria,i.serie].join(" ").toLowerCase().includes(q)) : items;
  const host = $("#list");
  if(!items.length){
    host.innerHTML = `<div class="empty">
      <h2>Aquí van a aparecer tus compras</h2>
      <ol>
        <li>Toca <b>Escanear boleta</b> y toma una foto donde se vea el QR.</li>
        <li>La app lee el RUC, el número de boleta, la fecha y el total.</li>
        <li>Escribe qué compraste. Listo: aunque pierdas la boleta, queda aquí.</li>
      </ol>
      <div class="note">¿Una boleta sin QR? Usa el botón <b>＋</b> para anotarla a mano.</div>
    </div>`; return;
  }
  if(!shown.length){ host.innerHTML = `<div class="note" style="padding:8px 2px">Nada coincide con “${esc(filter)}”.</div>`; return; }
  const groups = {};
  shown.forEach(i=>{ const k=(i.fecha||"").slice(0,7)||"sin-fecha"; (groups[k] ||= []).push(i); });
  host.innerHTML = Object.entries(groups).map(([k,list])=>{
    const label = k==="sin-fecha" ? "Sin fecha" : new Date(k+"-15").toLocaleDateString("es-PE",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase());
    const tot = list.reduce((a,i)=>a+(Number(i.total)||0),0);
    return `<section class="month"><div class="month-h"><h2>${esc(label)}</h2><span>${soles(tot)}</span></div>
      ${list.map(i=>{
        const day = i.fecha ? i.fecha.slice(8,10) : "—";
        return `<button class="row" data-id="${esc(i.id)}" type="button">
          <div class="thumb">${i.thumb?`<img src="${i.thumb}" alt="">`:day}</div>
          <div class="t"><div class="n">${esc(i.tienda||"Tienda sin nombre")}</div><div class="d">${esc(i.detalle||"Sin detalle")}</div></div>
          <div><div class="a">${soles(i.total)}</div><div class="c">${esc(i.categoria||"")}</div></div>
        </button>`; }).join("")}
    </section>`;
  }).join("");
}

/* ---------- Sheets ---------- */
function openSheet(html){
  $("#sheetHost").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") closeSheet(); });
  $("#sheetHost").querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeSheet));
}
function closeSheet(){ $("#sheetHost").innerHTML=""; }
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2400); }

function editSheet(pre){
  const it = Object.assign({id:"b"+Date.now().toString(36), fecha:todayISO(), total:"", tienda:"", detalle:"", categoria:""}, pre);
  if(it.ruc && !it.tienda && stores[it.ruc]) it.tienda = stores[it.ruc];
  const qr = it.ruc ? `<div class="receipt">
      <div class="qrok" style="margin-bottom:10px">✓ QR leído</div>
      <div class="kv"><span>RUC</span><span>${esc(it.ruc)}</span></div>
      <div class="kv"><span>${esc(TIPOS[it.tipo]||"Comprobante")}</span><span>${esc(it.serie)}-${esc(it.numero)}</span></div>
      <div class="kv"><span>IGV</span><span>${soles(it.igv)}</span></div>
      <div class="tot"><span>TOTAL</span><span>${soles(it.total)}</span></div>
    </div>` : (pre._tried ? `<div class="qrno">No encontré un QR de SUNAT en la foto. Puedes guardarla igual y completar los datos, o <button type="button" class="x" id="retryLive" style="color:var(--stamp);padding:0">escanear en vivo</button>.</div>` : "");
  openSheet(`
    <div class="sheet-h"><h3>${pre._edit?"Editar compra":"Nueva compra"}</h3><button class="x" data-close type="button">Cerrar</button></div>
    ${qr}
    ${pre._photo?`<img class="photo" src="${pre._photo}" alt="Foto de la boleta">`:""}
    <label class="f">Tienda<input id="fTienda" value="${esc(it.tienda)}" placeholder="Ej. Plaza Vea Javier Prado" autocomplete="off"></label>
    <label class="f">¿Qué compraste?<textarea id="fDetalle" placeholder="Ej. champú, pañales, 2 yogures">${esc(it.detalle)}</textarea></label>
    <div class="two">
      <label class="f">Total (S/)<input id="fTotal" inputmode="decimal" value="${it.total!==""?Number(it.total).toFixed(2):""}" placeholder="0.00"></label>
      <label class="f">Fecha<input id="fFecha" type="date" value="${esc(it.fecha)}"></label>
    </div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">Categoría
      <div class="chips" id="fCats">${CATS.map(c=>`<button type="button" class="chip" aria-pressed="${c===it.categoria}">${c}</button>`).join("")}</div>
    </div>
    <div class="actions"><button class="btn btn-main" id="fSave" type="button">Guardar</button></div>
  `);
  const rl=$("#retryLive"); if(rl) rl.onclick=()=>{ closeSheet(); scanLive(); };
  let cat = it.categoria;
  $("#fCats").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return;
    cat = b.getAttribute("aria-pressed")==="true" ? "" : b.textContent;
    $("#fCats").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x.textContent===cat)); });
  $("#fSave").addEventListener("click", async ()=>{
    const btn=$("#fSave"); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Guardando';
    const out = { id:it.id, tienda:$("#fTienda").value.trim(), detalle:$("#fDetalle").value.trim(),
      total: parseFloat($("#fTotal").value.replace(",", "."))||0, fecha:$("#fFecha").value||todayISO(), categoria:cat||"",
      ruc:it.ruc||"", tipo:it.tipo||"", serie:it.serie||"", numero:it.numero||"", igv:it.igv||0, qr:it.qr||"",
      thumb: it.thumb||"", hasPhoto: !!(it.hasPhoto||pre._photo), creado: it.creado||new Date().toISOString() };
    try{
      await Store.save(out, pre._photo||null);
      if(out.ruc && out.tienda && stores[out.ruc]!==out.tienda){ stores={...stores,[out.ruc]:out.tienda}; Store.saveStores(stores).catch(()=>{}); }
      closeSheet(); toast("Compra guardada");
    }catch(e){ btn.disabled=false; btn.textContent="Guardar"; toast("No se pudo guardar. Revisa tu conexión e intenta de nuevo."); }
  });
}

async function detailSheet(id){
  const it = items.find(i=>i.id===id); if(!it) return;
  openSheet(`
    <div class="sheet-h"><h3>${esc(it.tienda||"Compra")}</h3><button class="x" data-close type="button">Cerrar</button></div>
    <div class="receipt">
      <div class="kv"><span>Fecha</span><span>${esc(new Date(it.fecha+"T12:00").toLocaleDateString("es-PE",{weekday:"short",day:"numeric",month:"short",year:"numeric"}))}</span></div>
      ${it.ruc?`<div class="kv"><span>RUC</span><span>${esc(it.ruc)}</span></div>
      <div class="kv"><span>${esc(TIPOS[it.tipo]||"Comprobante")}</span><span>${esc(it.serie)}-${esc(it.numero)}</span></div>
      <div class="kv"><span>IGV</span><span>${soles(it.igv)}</span></div>`:""}
      ${it.categoria?`<div class="kv"><span>Categoría</span><span>${esc(it.categoria)}</span></div>`:""}
      <div style="padding:10px 0 4px;font-family:var(--body);font-size:15px;white-space:pre-wrap">${esc(it.detalle||"Sin detalle")}</div>
      <div class="tot"><span>TOTAL</span><span>${soles(it.total)}</span></div>
    </div>
    <div id="dPhoto">${it.hasPhoto?'<div class="note">Cargando foto…</div>':""}</div>
    <div class="actions">
      <button class="btn btn-ghost" id="dEdit" type="button">Editar</button>
      <button class="btn btn-danger" id="dDel" type="button">Borrar</button>
    </div>
  `);
  $("#dEdit").addEventListener("click", async ()=>{ const ph = it.hasPhoto ? await Store.photo(it.id) : null; editSheet({...it, _edit:true, _photo:null, _shownPhoto:ph}); });
  $("#dDel").addEventListener("click", ()=>{
    const a=$("#dDel").parentElement;
    a.innerHTML = `<div class="note" style="flex-basis:100%">¿Borrar esta compra y su foto? No se puede deshacer.</div>
      <button class="btn btn-ghost" id="dNo" type="button">Cancelar</button><button class="btn btn-main" id="dYes" type="button">Sí, borrar</button>`;
    $("#dNo").onclick=()=>detailSheet(id);
    $("#dYes").onclick=async()=>{ try{ await Store.remove(id); closeSheet(); toast("Compra borrada"); }catch{ toast("No se pudo borrar. Intenta de nuevo."); } };
  });
  if(it.hasPhoto){ const src = await Store.photo(it.id); const h=$("#dPhoto"); if(h) h.innerHTML = src?`<img class="photo" src="${src}" alt="Foto de la boleta">`:'<div class="note">La foto no está disponible.</div>'; }
}

/* ---------- Events ---------- */
$("#menuBtn").addEventListener("click", menuSheet);
$("#tipClose").addEventListener("click", ()=>{ META.set("tipClosed","1"); updateTips(); });
$("#backupNow").addEventListener("click", makeBackup);
$("#restoreFile").addEventListener("change", e=>{ const f=e.target.files[0]; e.target.value=""; if(f) restoreBackup(f); });
$("#scanBtn").addEventListener("click", scanLive);
$("#manualBtn").addEventListener("click", ()=>editSheet({}));
$("#q").addEventListener("input", e=>{ filter=e.target.value.trim(); render(); });
$("#list").addEventListener("click", e=>{ const r=e.target.closest(".row"); if(r) detailSheet(r.dataset.id); });
async function processImage(img){
  openSheet(`<div class="sheet-h"><h3>Leyendo boleta…</h3></div><div style="display:flex;gap:10px;align-items:center;color:var(--muted)"><span class="spin"></span> Buscando el código QR</div>`);
  await new Promise(r=>setTimeout(r,30));
  const text = img._qr || await decodeQR(img);
  const photo = compress(img);
  const thumb = compress(img, 120, .6);
  const parsed = text ? parseSunat(text) : null;
  editSheet({ ...(parsed||{}), qr:text||"", thumb:thumb||"", _photo:photo, _tried:true });
}
$("#file").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ await processImage(await loadImg(f)); }
  catch(err){ closeSheet(); toast("No pude abrir esa foto. Prueba con otra."); }
});

/* ---------- Escaneo en vivo ---------- */
let camStream=null, camLoop=0;
function stopCam(){ camLoop++; if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } const c=$("#cam"); if(c) c.remove(); }
async function scanLive(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || !window.ZXingWASM){ $("#file").click(); return; }
  const el=document.createElement("div"); el.className="cam"; el.id="cam";
  el.innerHTML=`<video playsinline muted autoplay></video><div class="frame"></div>
    <div class="hint">Apunta al QR de la boleta. Si está arrugada, estírala un poco.</div>
    <div class="top"><button type="button" id="camClose">Cancelar</button></div>
    <div class="bar"><button class="btn btn-ghost" type="button" id="camPhoto">Tomar foto</button><button class="btn btn-ghost" type="button" id="camManual">Sin QR</button></div>`;
  document.body.appendChild(el);
  $("#camClose").onclick=stopCam;
  $("#camPhoto").onclick=()=>{ stopCam(); $("#file").click(); };
  $("#camManual").onclick=()=>{ stopCam(); editSheet({}); };
  const video=el.querySelector("video");
  try{
    camStream=await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080} } });
  }catch(e){ stopCam(); toast("Sin permiso de cámara. Usa una foto."); $("#file").click(); return; }
  video.srcObject=camStream;
  try{ await video.play(); }catch{}
  const my=++camLoop;
  const work=document.createElement("canvas"), wx=work.getContext("2d",{willReadFrequently:true});
  let n=0;
  while(my===camLoop){
    await new Promise(r=>setTimeout(r,120));
    if(my!==camLoop) return;
    const vw=video.videoWidth, vh=video.videoHeight; if(!vw) continue;
    // alterna: recorte central (rápido y nítido) y cuadro completo
    const crop = (n++ % 3) !== 2;
    const side = Math.min(vw,vh) * (crop ? .8 : 1);
    const sx = crop ? (vw-side)/2 : 0, sy = crop ? (vh-side)/2 : 0, sw = crop ? side : vw, sh = crop ? side : vh;
    const scale = Math.min(1, 900/Math.max(sw,sh));
    work.width=Math.round(sw*scale); work.height=Math.round(sh*scale);
    wx.drawImage(video,sx,sy,sw,sh,0,0,work.width,work.height);
    let text=null;
    try{
      const r=await ZXingWASM.readBarcodes(wx.getImageData(0,0,work.width,work.height),{ formats:["QRCode"], tryHarder:true, tryRotate:true, tryInvert:false, maxNumberOfSymbols:1 });
      const ok=r.find(x=>x.isValid && x.text); if(ok) text=ok.text;
    }catch(e){}
    if(text && my===camLoop){
      el.querySelector(".frame").classList.add("hit");
      try{ navigator.vibrate && navigator.vibrate(40); }catch{}
      const full=document.createElement("canvas"); full.width=vw; full.height=vh; full.getContext("2d").drawImage(video,0,0);
      full._qr=text;
      stopCam();
      processImage(full);
      return;
    }
  }
}


boot();
